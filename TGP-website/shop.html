<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Generics Pharmacy - Shop</title>
  <meta name="description" content="Shop affordable and quality generic medicines and health products at The Generics Pharmacy." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-r from-red-100 via-red-50 to-red-100 min-h-screen flex flex-col">
  <header class="bg-white shadow sticky top-0 z-50" role="banner">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-3xl font-extrabold text-red-800" aria-label="The Generics Pharmacy Home">The Generics Pharmacy</a>
      <nav class="space-x-6 text-gray-700" role="navigation" aria-label="Primary Navigation" id="navLinks">
        <a href="index.html" class="hover:text-red-800 transition">Home</a>
        <a href="shop.html" class="hover:text-red-800 transition font-semibold text-red-800" aria-current="page">Shop</a>
        <a href="trading.html" class="hover:text-red-800 transition">Trading</a>
        <a href="about.html" class="hover:text-red-800 transition">About</a>
        <a href="contact.html" class="hover:text-red-800 transition">Contact</a>
        <a href="faq.html" class="hover:text-red-800 transition">FAQ</a>
        <a href="login.html" class="hover:text-red-800 transition">Login</a>
        <a href="register.html" class="hover:text-red-800 transition">Register</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow container mx-auto px-6 py-10">
    <h1 class="text-4xl font-extrabold text-red-900 mb-8 text-center">Shop Our Products</h1>

    <div class="flex flex-col md:flex-row md:justify-between mb-8 gap-4">
      <input type="text" id="searchInput" placeholder="Search products..." aria-label="Search products" class="w-full md:w-1/3 px-4 py-3 border border-red-300 rounded focus:outline-none focus:ring-2 focus:ring-red-600" />
      <select id="sortSelect" aria-label="Sort products" class="w-full md:w-1/4 px-4 py-3 border border-red-300 rounded focus:outline-none focus:ring-2 focus:ring-red-600">
        <option value="default">Sort by</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A to Z</option>
        <option value="name-desc">Name: Z to A</option>
      </select>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6" id="productGrid">
      <!-- Product cards will be dynamically inserted here -->
    </div>

    <section class="mt-12">
      <h2 class="text-2xl font-bold text-red-700 mb-4">Shopping Cart</h2>
      <div id="cart" class="bg-white rounded-lg shadow p-4 min-h-[150px]">
        <p class="text-gray-600">Your cart is empty.</p>
      </div>
      <button id="buyNowBtn" class="mt-4 bg-red-600 text-white py-2 px-6 rounded hover:bg-red-700 transition" disabled>Buy Now</button>
    </section>
  </main>

  <footer class="bg-white shadow mt-12">
    <div class="container mx-auto px-6 py-6 text-center text-gray-600 text-sm">
      &copy; 2024 The Generics Pharmacy. All rights reserved.
    </div>
  </footer>

  <script>
    const apiBase = 'http://localhost:3001';
    const productGrid = document.getElementById('productGrid');
    const cartContainer = document.getElementById('cart');
    const buyNowBtn = document.getElementById('buyNowBtn');
    const navLinks = document.getElementById('navLinks');

    let products = [];
    let cart = [];

    async function fetchProducts() {
      try {
        const res = await fetch(apiBase + '/products');
        if (!res.ok) throw new Error('Failed to fetch products');
        products = await res.json();
        renderProducts(products);
      } catch (err) {
        productGrid.innerHTML = '<p class="text-red-600">Failed to load products.</p>';
      }
    }

    function renderProducts(productsToRender) {
      productGrid.innerHTML = '';
      productsToRender.forEach(product => {
        const productCard = document.createElement('div');
        productCard.className = 'bg-white rounded-lg shadow p-4 flex flex-col';
        productCard.innerHTML = `
          <img src="${product.image}" alt="${product.name}" class="rounded mb-4 object-cover h-40" loading="lazy" />
          <h3 class="font-semibold text-lg mb-2">${product.name}</h3>
          <p class="text-red-700 font-bold mb-2">$${product.price.toFixed(2)}</p>
          <p class="text-gray-700 mb-4">${product.description}</p>
          <button class="mt-auto bg-red-600 text-white py-2 rounded hover:bg-red-700 transition add-to-cart" data-id="${product._id}" data-name="${product.name}" data-price="${product.price}">Add to Cart</button>
        `;
        productGrid.appendChild(productCard);
      });
      attachAddToCartListeners();
    }

    function attachAddToCartListeners() {
      document.querySelectorAll('.add-to-cart').forEach(button => {
        button.addEventListener('click', () => {
          const id = button.getAttribute('data-id');
          const name = button.getAttribute('data-name');
          const price = parseFloat(button.getAttribute('data-price'));
          addToCart({ id, name, price });
        });
      });
    }

    function renderCart() {
      if (cart.length === 0) {
        cartContainer.innerHTML = '<p class="text-gray-600">Your cart is empty.</p>';
        buyNowBtn.disabled = true;
        return;
      }
      let html = '<ul class="divide-y divide-gray-200">';
      let total = 0;
      cart.forEach((item, index) => {
        total += item.price;
        html += `<li class="py-2 flex justify-between items-center">
          <span>${item.name}</span>
          <span>$${item.price.toFixed(2)}</span>
          <button class="text-red-500 hover:text-red-700 ml-4" onclick="removeFromCart(${index})" aria-label="Remove item"><i class="fas fa-trash"></i></button>
        </li>`;
      });
      html += `</ul><div class="mt-4 font-bold text-right">Total: $${total.toFixed(2)}</div>`;
      cartContainer.innerHTML = html;
      buyNowBtn.disabled = false;
    }

    function addToCart(product) {
      if (!isLoggedIn()) {
        alert('Please login to add items to your cart.');
        window.location.href = 'login.html';
        return;
      }
      cart.push(product);
      renderCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    buyNowBtn.addEventListener('click', async () => {
      if (cart.length === 0) return;
      if (!isLoggedIn()) {
        alert('Please login to make a purchase.');
        window.location.href = 'login.html';
        return;
      }
      const token = localStorage.getItem('authToken');
      try {
        for (const item of cart) {
          const res = await fetch(apiBase + '/purchase', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ productId: item.id }),
          });
          if (!res.ok) throw new Error('Purchase failed');
        }
        alert('Thank you for your purchase!');
        cart = [];
        renderCart();
      } catch (err) {
        alert('Purchase failed. Please try again.');
      }
    });

    function isLoggedIn() {
      return localStorage.getItem('authToken') !== null;
    }

    function updateNav() {
      if (isLoggedIn()) {
        const username = localStorage.getItem('username') || 'User';
        navLinks.innerHTML += `
          <span class="text-red-700 font-semibold">Hello, ${username}</span>
          <button id="logoutBtn" class="ml-4 text-red-600 hover:text-red-800">Logout</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          localStorage.clear();
          alert('You have been logged out.');
          window.location.reload();
        });
      } else {
        navLinks.innerHTML += '<a href="login.html" class="hover:text-red-700 transition">Login</a>';
      }
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      const query = this.value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      renderProducts(filtered);
    });

    document.getElementById('sortSelect').addEventListener('change', function() {
      let sorted = [...products];
      switch (this.value) {
        case 'price-asc':
          sorted.sort((a, b) => a.price - b.price);
          break;
        case 'price-desc':
          sorted.sort((a, b) => b.price - a.price);
          break;
        case 'name-asc':
          sorted.sort((a, b) => a.name.localeCompare(b.name));
          break;
        case 'name-desc':
          sorted.sort((a, b) => b.name.localeCompare(a.name));
          break;
      }
      renderProducts(sorted);
    });

    updateNav();
    fetchProducts();
    renderCart();
  </script>
</body>
</html>
