<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Generics Pharmacy - Register</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-center items-center">
  <div class="bg-white rounded-lg shadow p-8 max-w-md w-full">
    <h1 class="text-3xl font-bold text-green-800 mb-6 text-center">Register</h1>
    <form id="registerForm" novalidate>
      <div class="mb-4">
        <label for="username" class="block font-semibold mb-1">Username</label>
        <input type="text" id="username" name="username" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
      </div>
      <div class="mb-4">
        <label for="email" class="block font-semibold mb-1">Email</label>
        <input type="email" id="email" name="email" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
      </div>
      <div class="mb-4">
        <label for="password" class="block font-semibold mb-1">Password</label>
        <input type="password" id="password" name="password" required minlength="6" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
      </div>
      <button type="submit" class="bg-green-600 text-white py-2 px-6 rounded hover:bg-green-700 transition w-full">Register</button>
    </form>
    <p class="mt-4 text-center text-gray-700">Already have an account? <a href="login.html" class="text-green-700 hover:underline">Login here</a>.</p>
  </div>

  <script>
    const registerForm = document.getElementById('registerForm');

    registerForm.addEventListener('submit', function(event) {
      event.preventDefault();
      if (!registerForm.checkValidity()) {
        registerForm.reportValidity();
        return;
      }
      const username = registerForm.username.value.trim();
      const email = registerForm.email.value.trim();
      const password = registerForm.password.value;

      if (!username || !email || !password) {
        alert('Please fill in all fields.');
        return;
      }

      let users = JSON.parse(localStorage.getItem('users') || '[]');
      if (users.find(u => u.username === username)) {
        alert('Username already exists. Please choose another.');
        return;
      }
      if (users.find(u => u.email === email)) {
        alert('Email already registered. Please login or use another email.');
        return;
      }

      users.push({ username, email, password });
      localStorage.setItem('users', JSON.stringify(users));
      alert('Registration successful! You can now login.');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
