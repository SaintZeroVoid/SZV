<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Generics Pharmacy - Shop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold text-green-700">The Generics Pharmacy</a>
      <nav class="space-x-6 text-gray-700" id="navLinks">
        <a href="index.html" class="hover:text-green-700 transition">Home</a>
        <a href="shop.html" class="hover:text-green-700 transition font-semibold text-green-700">Shop</a>
        <a href="trading.html" class="hover:text-green-700 transition">Trading</a>
        <a href="about.html" class="hover:text-green-700 transition">About</a>
        <a href="contact.html" class="hover:text-green-700 transition">Contact</a>
        <a href="faq.html" class="hover:text-green-700 transition">FAQ</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow container mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold text-green-800 mb-8">Shop Products</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
      <!-- Product Card -->
      <div class="bg-white rounded-lg shadow p-4 flex flex-col">
        <img src="https://images.pexels.com/photos/433267/pexels-photo-433267.jpeg?auto=compress&cs=tinysrgb&h=150" alt="Pain Relief Tablets" class="rounded mb-4 object-cover h-40" />
        <h3 class="font-semibold text-lg mb-2">Pain Relief Tablets</h3>
        <p class="text-green-700 font-bold mb-2">$9.99</p>
        <button class="mt-auto bg-green-600 text-white py-2 rounded hover:bg-green-700 transition add-to-cart" data-product="Pain Relief Tablets" data-price="9.99">Add to Cart</button>
      </div>
      <div class="bg-white rounded-lg shadow p-4 flex flex-col">
        <img src="https://images.pexels.com/photos/40568/medicine-vitamins-health-supplements-40568.jpeg?auto=compress&cs=tinysrgb&h=150" alt="Vitamin C Supplements" class="rounded mb-4 object-cover h-40" />
        <h3 class="font-semibold text-lg mb-2">Vitamin C Supplements</h3>
        <p class="text-green-700 font-bold mb-2">$14.99</p>
        <button class="mt-auto bg-green-600 text-white py-2 rounded hover:bg-green-700 transition add-to-cart" data-product="Vitamin C Supplements" data-price="14.99">Add to Cart</button>
      </div>
      <div class="bg-white rounded-lg shadow p-4 flex flex-col">
        <img src="https://images.pexels.com/photos/40568/cough-syrup-medicine-health-40568.jpeg?auto=compress&cs=tinysrgb&h=150" alt="Cough Syrup" class="rounded mb-4 object-cover h-40" />
        <h3 class="font-semibold text-lg mb-2">Cough Syrup</h3>
        <p class="text-green-700 font-bold mb-2">$7.99</p>
        <button class="mt-auto bg-green-600 text-white py-2 rounded hover:bg-green-700 transition add-to-cart" data-product="Cough Syrup" data-price="7.99">Add to Cart</button>
      </div>
      <div class="bg-white rounded-lg shadow p-4 flex flex-col">
        <img src="https://images.pexels.com/photos/40568/allergy-relief-medicine-health-40568.jpeg?auto=compress&cs=tinysrgb&h=150" alt="Allergy Relief" class="rounded mb-4 object-cover h-40" />
        <h3 class="font-semibold text-lg mb-2">Allergy Relief</h3>
        <p class="text-green-700 font-bold mb-2">$12.99</p>
        <button class="mt-auto bg-green-600 text-white py-2 rounded hover:bg-green-700 transition add-to-cart" data-product="Allergy Relief" data-price="12.99">Add to Cart</button>
      </div>
    </div>

    <section class="mt-12">
      <h2 class="text-2xl font-bold text-green-700 mb-4">Shopping Cart</h2>
      <div id="cart" class="bg-white rounded-lg shadow p-4 min-h-[150px]">
        <p class="text-gray-600">Your cart is empty.</p>
      </div>
      <button id="buyNowBtn" class="mt-4 bg-blue-600 text-white py-2 px-6 rounded hover:bg-blue-700 transition" disabled>Buy Now</button>
    </section>
  </main>

  <footer class="bg-white shadow mt-12">
    <div class="container mx-auto px-4 py-6 text-center text-gray-600 text-sm">
      &copy; 2024 The Generics Pharmacy. All rights reserved.
    </div>
  </footer>

  <script>
    const cart = [];
    const cartContainer = document.getElementById('cart');
    const buyNowBtn = document.getElementById('buyNowBtn');
    const navLinks = document.getElementById('navLinks');

    function renderCart() {
      if (cart.length === 0) {
        cartContainer.innerHTML = '<p class="text-gray-600">Your cart is empty.</p>';
        buyNowBtn.disabled = true;
        return;
      }
      let html = '<ul class="divide-y divide-gray-200">';
      let total = 0;
      cart.forEach((item, index) => {
        total += item.price;
        html += `<li class="py-2 flex justify-between items-center">
          <span>${item.name}</span>
          <span>$ ${item.price.toFixed(2)}</span>
          <button class="text-red-500 hover:text-red-700 ml-4" onclick="removeFromCart(${index})" aria-label="Remove item"><i class="fas fa-trash"></i></button>
        </li>`;
      });
      html += `</ul><div class="mt-4 font-bold text-right">Total: $${total.toFixed(2)}</div>`;
      cartContainer.innerHTML = html;
      buyNowBtn.disabled = false;
    }

    function addToCart(name, price) {
      if (!isLoggedIn()) {
        alert('Please login to add items to your cart.');
        window.location.href = 'login.html';
        return;
      }
      cart.push({ name, price });
      renderCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    buyNowBtn.addEventListener('click', () => {
      if (cart.length === 0) return;
      if (!isLoggedIn()) {
        alert('Please login to make a purchase.');
        window.location.href = 'login.html';
        return;
      }
      alert('Thank you for your purchase! Your order has been placed.');
      cart.length = 0;
      renderCart();
    });

    function isLoggedIn() {
      return localStorage.getItem('loggedInUser') !== null;
    }

    function updateNav() {
      if (isLoggedIn()) {
        const user = JSON.parse(localStorage.getItem('loggedInUser'));
        navLinks.innerHTML += `
          <span class="text-green-700 font-semibold">Hello, ${user.username}</span>
          <button id="logoutBtn" class="ml-4 text-red-600 hover:text-red-800">Logout</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          localStorage.removeItem('loggedInUser');
          alert('You have been logged out.');
          window.location.reload();
        });
      } else {
        navLinks.innerHTML += '<a href="login.html" class="hover:text-green-700 transition">Login</a>';
      }
    }

    document.querySelectorAll('.add-to-cart').forEach(button => {
      button.addEventListener('click', () => {
        const name = button.getAttribute('data-product');
        const price = parseFloat(button.getAttribute('data-price'));
        addToCart(name, price);
      });
    });

    updateNav();
    renderCart();
  </script>
</body>
</html>
