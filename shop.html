<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="The Generics Pharmacy - Shop affordable and quality generic medicines and health products." />
  <title>The Generics Pharmacy - Shop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="bg-white shadow sticky top-0 z-50" role="banner">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="text-3xl font-extrabold text-green-700" aria-label="The Generics Pharmacy Home">The Generics Pharmacy</a>
      <nav class="space-x-6 text-gray-700" role="navigation" aria-label="Primary Navigation">
        <a href="index.html" class="hover:text-green-700 transition">Home</a>
        <a href="shop.html" class="hover:text-green-700 transition font-semibold text-green-700" aria-current="page">Shop</a>
        <a href="trading.html" class="hover:text-green-700 transition">Trading</a>
        <a href="about.html" class="hover:text-green-700 transition">About</a>
        <a href="contact.html" class="hover:text-green-700 transition">Contact</a>
        <a href="faq.html" class="hover:text-green-700 transition">FAQ</a>
        <a href="login.html" class="hover:text-green-700 transition">Login</a>
        <a href="register.html" class="hover:text-green-700 transition">Register</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow container mx-auto px-4 py-10">
    <h1 class="text-4xl font-extrabold text-green-800 mb-8 text-center">Shop Our Products</h1>

    <div class="flex flex-col md:flex-row md:justify-between mb-8 gap-4">
      <input type="text" id="searchInput" placeholder="Search products..." aria-label="Search products" class="w-full md:w-1/3 px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-600" />
      <select id="sortSelect" aria-label="Sort products" class="w-full md:w-1/4 px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-600">
        <option value="default">Sort by</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A to Z</option>
        <option value="name-desc">Name: Z to A</option>
      </select>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6" id="productGrid">
      <!-- Product cards will be dynamically inserted here -->
    </div>

    <section class="mt-12">
      <h2 class="text-2xl font-bold text-green-700 mb-4">Shopping Cart</h2>
      <div id="cart" class="bg-white rounded-lg shadow p-4 min-h-[150px]">
        <p class="text-gray-600">Your cart is empty.</p>
      </div>
      <button id="buyNowBtn" class="mt-4 bg-blue-600 text-white py-2 px-6 rounded hover:bg-blue-700 transition" disabled>Buy Now</button>
    </section>
  </main>

  <footer class="bg-white shadow mt-12">
    <div class="container mx-auto px-4 py-6 text-center text-gray-600 text-sm">
      &copy; 2024 The Generics Pharmacy. All rights reserved.
    </div>
  </footer>

  <script>
    const products = [
      { name: "Pain Relief Tablets", price: 9.99, image: "https://images.pexels.com/photos/433267/pexels-photo-433267.jpeg?auto=compress&cs=tinysrgb&h=150" },
      { name: "Vitamin C Supplements", price: 14.99, image: "https://images.pexels.com/photos/40568/medicine-vitamins-health-supplements-40568.jpeg?auto=compress&cs=tinysrgb&h=150" },
      { name: "Cough Syrup", price: 7.99, image: "https://images.pexels.com/photos/40568/cough-syrup-medicine-health-40568.jpeg?auto=compress&cs=tinysrgb&h=150" },
      { name: "Allergy Relief", price: 12.99, image: "https://images.pexels.com/photos/40568/allergy-relief-medicine-health-40568.jpeg?auto=compress&cs=tinysrgb&h=150" },
      { name: "Antibiotic Capsules", price: 19.99, image: "https://images.pexels.com/photos/40568/antibiotic-capsules-medicine-health-40568.jpeg?auto=compress&cs=tinysrgb&h=150" },
      { name: "Antacid Tablets", price: 11.99, image: "https://images.pexels.com/photos/40568/antacid-tablets-medicine-health-40568.jpeg?auto=compress&cs=tinysrgb&h=150" },
      { name: "Eye Drops", price: 8.99, image: "https://images.pexels.com/photos/40568/eye-drops-medicine-health-40568.jpeg?auto=compress&cs=tinysrgb&h=150" },
      { name: "Nasal Spray", price: 10.99, image: "https://images.pexels.com/photos/40568/nasal-spray-medicine-health-40568.jpeg?auto=compress&cs=tinysrgb&h=150" }
    ];

    const cart = [];
    const productGrid = document.getElementById('productGrid');
    const cartContainer = document.getElementById('cart');
    const buyNowBtn = document.getElementById('buyNowBtn');
    const navLinks = document.getElementById('navLinks');

    function renderProducts(productsToRender) {
      productGrid.innerHTML = '';
      productsToRender.forEach(product => {
        const productCard = document.createElement('div');
        productCard.className = 'bg-white rounded-lg shadow p-4 flex flex-col';
        productCard.innerHTML = `
          <img src="${product.image}" alt="${product.name}" class="rounded mb-4 object-cover h-40" loading="lazy" />
          <h3 class="font-semibold text-lg mb-2">${product.name}</h3>
          <p class="text-green-700 font-bold mb-2">$${product.price.toFixed(2)}</p>
          <button class="mt-auto bg-green-600 text-white py-2 rounded hover:bg-green-700 transition add-to-cart" data-product="${product.name}" data-price="${product.price}">Add to Cart</button>
        `;
        productGrid.appendChild(productCard);
      });
      attachAddToCartListeners();
    }

    function attachAddToCartListeners() {
      document.querySelectorAll('.add-to-cart').forEach(button => {
        button.addEventListener('click', () => {
          const name = button.getAttribute('data-product');
          const price = parseFloat(button.getAttribute('data-price'));
          addToCart(name, price);
        });
      });
    }

    function renderCart() {
      if (cart.length === 0) {
        cartContainer.innerHTML = '<p class="text-gray-600">Your cart is empty.</p>';
        buyNowBtn.disabled = true;
        return;
      }
      let html = '<ul class="divide-y divide-gray-200">';
      let total = 0;
      cart.forEach((item, index) => {
        total += item.price;
        html += `<li class="py-2 flex justify-between items-center">
          <span>${item.name}</span>
          <span>$${item.price.toFixed(2)}</span>
          <button class="text-red-500 hover:text-red-700 ml-4" onclick="removeFromCart(${index})" aria-label="Remove item"><i class="fas fa-trash"></i></button>
        </li>`;
      });
      html += `</ul><div class="mt-4 font-bold text-right">Total: $${total.toFixed(2)}</div>`;
      cartContainer.innerHTML = html;
      buyNowBtn.disabled = false;
    }

    function addToCart(name, price) {
      if (!isLoggedIn()) {
        alert('Please login to add items to your cart.');
        window.location.href = 'login.html';
        return;
      }
      cart.push({ name, price });
      renderCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    buyNowBtn.addEventListener('click', () => {
      if (cart.length === 0) return;
      if (!isLoggedIn()) {
        alert('Please login to make a purchase.');
        window.location.href = 'login.html';
        return;
      }
      // Send order confirmation email
      const user = JSON.parse(localStorage.getItem('loggedInUser'));
      const orderDetails = cart.map(item => `${item.name} - $${item.price.toFixed(2)}`).join('\n');
      const emailData = {
        to: user.email,
        subject: 'Order Confirmation - The Generics Pharmacy',
        text: `Dear ${user.username},\n\nThank you for your purchase! Your order details:\n${orderDetails}\n\nRegards,\nThe Generics Pharmacy`
      };

      fetch('http://localhost:3001/send-order-confirmation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(emailData)
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert('Thank you for your purchase! A confirmation email has been sent.');
        } else {
          alert('Thank you for your purchase! However, we could not send a confirmation email.');
        }
      })
      .catch(() => {
        alert('Thank you for your purchase! However, we could not send a confirmation email.');
      });

      cart.length = 0;
      renderCart();
    });

    function isLoggedIn() {
      return localStorage.getItem('loggedInUser') !== null;
    }

    function updateNav() {
      if (isLoggedIn()) {
        const user = JSON.parse(localStorage.getItem('loggedInUser'));
        navLinks.innerHTML += `
          <span class="text-green-700 font-semibold">Hello, ${user.username}</span>
          <button id="logoutBtn" class="ml-4 text-red-600 hover:text-red-800">Logout</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          localStorage.removeItem('loggedInUser');
          alert('You have been logged out.');
          window.location.reload();
        });
      } else {
        navLinks.innerHTML += '<a href="login.html" class="hover:text-green-700 transition">Login</a>';
      }
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      const query = this.value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      renderProducts(filtered);
    });

    document.getElementById('sortSelect').addEventListener('change', function() {
      let sorted = [...products];
      switch (this.value) {
        case 'price-asc':
          sorted.sort((a, b) => a.price - b.price);
          break;
        case 'price-desc':
          sorted.sort((a, b) => b.price - a.price);
          break;
        case 'name-asc':
          sorted.sort((a, b) => a.name.localeCompare(b.name));
          break;
        case 'name-desc':
          sorted.sort((a, b) => b.name.localeCompare(a.name));
          break;
      }
      renderProducts(sorted);
    });

    updateNav();
    renderProducts(products);
    renderCart();
  </script>
</body>
</html>
