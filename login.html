<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Generics Pharmacy - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-center items-center">
  <div class="bg-white rounded-lg shadow p-8 max-w-md w-full">
    <h1 class="text-3xl font-bold text-green-800 mb-6 text-center">Login</h1>
    <form id="loginForm" novalidate>
      <div class="mb-4">
        <label for="username" class="block font-semibold mb-1">Username</label>
        <input type="text" id="username" name="username" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
      </div>
      <div class="mb-4">
        <label for="password" class="block font-semibold mb-1">Password</label>
        <input type="password" id="password" name="password" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
      </div>
      <button type="submit" class="bg-green-600 text-white py-2 px-6 rounded hover:bg-green-700 transition w-full">Login</button>
    </form>
    <p class="mt-4 text-center text-gray-700">Don't have an account? <a href="register.html" class="text-green-700 hover:underline">Register here</a>.</p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', function(event) {
      event.preventDefault();
      if (!loginForm.checkValidity()) {
        loginForm.reportValidity();
        return;
      }
      const username = loginForm.username.value.trim();
      const password = loginForm.password.value;

      let users = JSON.parse(localStorage.getItem('users') || '[]');
      const user = users.find(u => u.username === username && u.password === password);
      if (!user) {
        alert('Invalid username or password.');
        return;
      }

      localStorage.setItem('loggedInUser', JSON.stringify(user));
      alert('Login successful!');
      window.location.href = 'shop.html';
    });
  </script>
</body>
</html>
