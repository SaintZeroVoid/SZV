<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Generics Pharmacy - Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold text-green-700">The Generics Pharmacy - Admin</a>
      <nav class="space-x-6 text-gray-700">
        <a href="index.html" class="hover:text-green-700 transition">Home</a>
        <a href="shop.html" class="hover:text-green-700 transition">Shop</a>
        <a href="trading.html" class="hover:text-green-700 transition">Trading</a>
        <a href="admin.html" class="hover:text-green-700 transition font-semibold text-green-700">Admin</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow container mx-auto px-4 py-10 max-w-4xl space-y-10">
    <section>
      <h1 class="text-3xl font-bold text-green-800 mb-6">Admin Panel - Manage Products</h1>

      <form id="productForm" class="bg-white rounded-lg shadow p-6 mb-8" novalidate>
        <div class="mb-4">
          <label for="productName" class="block font-semibold mb-1">Product Name</label>
          <input type="text" id="productName" name="productName" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
        </div>
        <div class="mb-4">
          <label for="productPrice" class="block font-semibold mb-1">Price ($)</label>
          <input type="number" id="productPrice" name="productPrice" min="0" step="0.01" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
        </div>
        <button type="submit" class="bg-green-600 text-white py-2 px-6 rounded hover:bg-green-700 transition">Add Product</button>
      </form>

      <section>
        <h2 class="text-2xl font-bold text-green-700 mb-4">Product List</h2>
        <ul id="productList" class="divide-y divide-gray-200 bg-white rounded-lg shadow p-4"></ul>
      </section>
    </section>

    <section>
      <h1 class="text-3xl font-bold text-green-800 mb-6">Admin Panel - Reviews</h1>
      <ul id="reviewList" class="divide-y divide-gray-200 bg-white rounded-lg shadow p-4"></ul>
    </section>

    <section>
      <h1 class="text-3xl font-bold text-green-800 mb-6">Admin Panel - Registered Accounts</h1>
      <ul id="accountList" class="divide-y divide-gray-200 bg-white rounded-lg shadow p-4"></ul>
    </section>
  </main>

  <footer class="bg-white shadow mt-12">
    <div class="container mx-auto px-4 py-6 text-center text-gray-600 text-sm">
      &copy; 2024 The Generics Pharmacy. All rights reserved.
    </div>
  </footer>

  <script>
    const productForm = document.getElementById('productForm');
    const productList = document.getElementById('productList');
    const reviewList = document.getElementById('reviewList');
    const accountList = document.getElementById('accountList');

    const apiBase = 'http://localhost:3001';

    function getAuthToken() {
      return localStorage.getItem('authToken');
    }

    function getAuthHeaders() {
      const token = getAuthToken();
      return token ? { 'Authorization': token } : {};
    }

    async function loadProducts() {
      const res = await fetch(apiBase + '/products', {
        headers: getAuthHeaders()
      });
      if (res.status === 401) {
        window.location.href = 'login.html';
        return;
      }
      const products = await res.json();
      productList.innerHTML = '';
      products.forEach(product => {
        const li = document.createElement('li');
        li.className = 'py-3 flex justify-between items-center';
        li.innerHTML = '<span>' + product.name + ' - $ ' + product.price.toFixed(2) + '</span>' +
          '<button class="text-red-500 hover:text-red-700" aria-label="Delete product" data-id="' + product.id + '">' +
          '<i class="fas fa-trash"></i></button>';
        productList.appendChild(li);
      });
    }

    async function addProduct(name, price) {
      await fetch(apiBase + '/products', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, getAuthHeaders()),
        body: JSON.stringify({ name, price }),
      });
      loadProducts();
    }

    async function deleteProduct(id) {
      await fetch(apiBase + '/products/' + id, {
        method: 'DELETE',
        headers: getAuthHeaders()
      });
      loadProducts();
    }

    productForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!productForm.checkValidity()) {
        productForm.reportValidity();
        return;
      }
      const name = productForm.productName.value.trim();
      const price = parseFloat(productForm.productPrice.value);
      if (!name || isNaN(price)) return;
      addProduct(name, price);
      productForm.reset();
    });

    productList.addEventListener('click', (e) => {
      if (e.target.closest('button')) {
        const id = e.target.closest('button').dataset.id;
        deleteProduct(parseInt(id));
      }
    });

    async function loadReviews() {
      const res = await fetch(apiBase + '/reviews', {
        headers: getAuthHeaders()
      });
      if (res.status === 401) {
        window.location.href = 'login.html';
        return;
      }
      const reviews = await res.json();
      reviewList.innerHTML = '';
      reviews.forEach(review => {
        const li = document.createElement('li');
        li.className = 'py-3';
        li.innerHTML = '<p><strong>' + review.user + '</strong> rated ' + review.rating + ' / 5</p>' +
          '<p>' + review.comment + '</p>';
        reviewList.appendChild(li);
      });
    }

    async function loadAccounts() {
      const res = await fetch(apiBase + '/accounts', {
        headers: getAuthHeaders()
      });
      if (res.status === 401) {
        window.location.href = 'login.html';
        return;
      }
      const accounts = await res.json();
      accountList.innerHTML = '';
      accounts.forEach(account => {
        const li = document.createElement('li');
        li.className = 'py-3';
        li.innerHTML = '<p><strong>Username:</strong> ' + account.username + '</p>' +
          '<p><strong>Email:</strong> ' + account.email + '</p>';
        accountList.appendChild(li);
      });
    }

    // Initial load
    loadProducts();
    loadReviews();
    loadAccounts();
  </script>
</body>
</html>
