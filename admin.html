<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard - The Generics Pharmacy</title>
  <meta name="description" content="Admin dashboard for managing The Generics Pharmacy website." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <header class="bg-red-700 text-white p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">Admin Dashboard</h1>
    <button id="logoutBtn" class="bg-red-600 hover:bg-red-800 px-4 py-2 rounded">Logout</button>
  </header>

  <main class="flex-grow container mx-auto p-6">
    <section class="mb-8">
      <h2 class="text-xl font-semibold mb-4">Manage Products</h2>
      <button id="addProductBtn" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition mb-4">Add New Product</button>
      <div id="productList" class="bg-white rounded shadow p-4">
        <!-- Product list will be rendered here -->
      </div>
    </section>

    <section>
      <h2 class="text-xl font-semibold mb-4">Manage Users</h2>
      <div id="userList" class="bg-white rounded shadow p-4">
        <!-- User list will be rendered here -->
      </div>
    </section>
  </main>

  <script>
    const logoutBtn = document.getElementById('logoutBtn');
    const productList = document.getElementById('productList');
    const userList = document.getElementById('userList');

    const apiBase = 'http://localhost:3001'; // Update to your backend URL if deployed

    logoutBtn.addEventListener('click', () => {
      localStorage.clear();
      window.location.href = 'login.html';
    });

    async function fetchProducts() {
      try {
        const res = await fetch(apiBase + '/products');
        if (!res.ok) throw new Error('Failed to fetch products');
        const products = await res.json();
        renderProducts(products);
      } catch (err) {
        productList.innerHTML = '<p class="text-red-600">Failed to load products.</p>';
      }
    }

    function renderProducts(products) {
      if (products.length === 0) {
        productList.innerHTML = '<p>No products available.</p>';
        return;
      }
      let html = '<ul class="divide-y divide-gray-200">';
      products.forEach(product => {
        html += `
          <li class="py-2 flex justify-between items-center">
            <span>${product.name} - ₱${product.price.toFixed(2)}</span>
            <button class="text-red-600 hover:text-red-800" onclick="deleteProduct('${product._id}')">Delete</button>
          </li>
        `;
      });
      html += '</ul>';
      productList.innerHTML = html;
    }

    async function deleteProduct(productId) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      try {
        const token = localStorage.getItem('authToken');
        const res = await fetch(apiBase + '/products/' + productId, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) throw new Error('Failed to delete product');
        alert('Product deleted');
        fetchProducts();
      } catch (err) {
        alert('Error deleting product');
      }
    }

    async function fetchUsers() {
      try {
        const token = localStorage.getItem('authToken');
        const res = await fetch(apiBase + '/users', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) throw new Error('Failed to fetch users');
        const users = await res.json();
        renderUsers(users);
      } catch (err) {
        userList.innerHTML = '<p class="text-red-600">Failed to load users.</p>';
      }
    }

    function renderUsers(users) {
      if (users.length === 0) {
        userList.innerHTML = '<p>No users found.</p>';
        return;
      }
      let html = '<ul class="divide-y divide-gray-200">';
      users.forEach(user => {
        html += `
          <li class="py-2 flex justify-between items-center">
            <span>${user.username} (${user.role})</span>
            <button class="text-red-600 hover:text-red-800" onclick="deleteUser('${user.id}')">Delete</button>
          </li>
        `;
      });
      html += '</ul>';
      userList.innerHTML = html;
    }

    async function deleteUser(userId) {
      if (!confirm('Are you sure you want to delete this user?')) return;
      try {
        const token = localStorage.getItem('authToken');
        const res = await fetch(apiBase + '/users/' + userId, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) throw new Error('Failed to delete user');
        alert('User deleted');
        fetchUsers();
      } catch (err) {
        alert('Error deleting user');
      }
    }

    // Initial fetch
    fetchProducts();
    fetchUsers();
  </script>
</body>
</html>
